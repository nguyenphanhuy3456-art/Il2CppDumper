name: Build Dumper
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      - name: Configure csproj
        run: |
          cd Il2CppDumper
          sed -i 's/<TargetFrameworks>net6.0;net8.0<\/TargetFrameworks>/<TargetFramework>net6.0<\/TargetFramework>/' Il2CppDumper.csproj
      - name: Build
        run: |
          cd Il2CppDumper
          dotnet build -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: Il2CppDumper-net6
          path: Il2CppDumper/bin/Release/net6.0/
